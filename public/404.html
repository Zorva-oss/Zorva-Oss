<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zorva — Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages, Netlify & custom static hosts
      // Store the requested path in sessionStorage and redirect to /
      var path = window.location.pathname + window.location.search + window.location.hash;
      sessionStorage.setItem('zorva_redirect_path', path);
      window.location.replace('/');
    </script>
  </head>
  <body style="background:#070913;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <p>Redirecting to Zorva...</p>
  </body>
</html>
